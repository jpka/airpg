<title>LATENT Spectator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a 9:16 "stage" built for capture (vertical shorts), with an operator side panel
   (sessions, clips, review, ledger, live) that stacks under it on phones.
   Palette: voltage-sensitive-dye microscopy — hyperpolarized teal (coherence) vs
   depolarized coral (stress), amber for the dice, violet for the Latent. Dark-first. */
:root {
  --ground: #0a0c17; --panel: #12162a; --panel-2: #1a1f38; --line: #2a3150;
  --ink: #e7e9f4; --muted: #8e94b6; --faint: #5d6488;
  --hyper: #4fd8c8; --depol: #ff8a5c; --volt: #f3cf63; --latent: #ad8fff;
  --ok: #5fd39a; --warn: #f3cf63; --bad: #ff6f6f;
  --sig-s: 72%; --sig-l: 66%;
  --display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --text: 'Newsreader', 'Iowan Old Style', Georgia, serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --ground: #edeff6; --panel: #ffffff; --panel-2: #f3f4fa; --line: #d3d7e8;
  --ink: #141729; --muted: #575d7e; --faint: #8a8fab;
  --hyper: #0b8a7f; --depol: #cf4b25; --volt: #9a7300; --latent: #6646cf;
  --ok: #1d8a55; --warn: #9a7300; --bad: #c62f2f;
  --sig-s: 62%; --sig-l: 38%; color-scheme: light;
} }
:root[data-theme="light"] {
  --ground: #edeff6; --panel: #ffffff; --panel-2: #f3f4fa; --line: #d3d7e8;
  --ink: #141729; --muted: #575d7e; --faint: #8a8fab;
  --hyper: #0b8a7f; --depol: #cf4b25; --volt: #9a7300; --latent: #6646cf;
  --ok: #1d8a55; --warn: #9a7300; --bad: #c62f2f;
  --sig-s: 62%; --sig-l: 38%; color-scheme: light;
}
html, body { background: var(--ground); color: var(--ink); }
body { font-family: var(--text); font-size: 16px; line-height: 1.45; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; }
* { box-sizing: border-box; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--hyper); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.app { display: grid; gap: 20px; max-width: 1180px; margin: 0 auto; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 940px) { .app { grid-template-columns: 440px minmax(0, 1fr); align-items: start; } .stage-wrap { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); } }

/* ---------- stage ---------- */
.stage-wrap { display: grid; gap: 10px; min-width: 0; }
.stage { position: relative; width: 100%; max-width: 440px; margin: 0 auto; aspect-ratio: 9 / 16; max-height: 84svh; overflow: hidden; border-radius: 22px; background: var(--ground); border: 1px solid var(--line); display: flex; flex-direction: column; isolation: isolate; }
@media (max-width: 939px) { .stage { max-height: 78svh; } }
#field { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: .9; }
.hud { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px 6px; }
.brand { font-family: var(--display); font-weight: 800; letter-spacing: .32em; font-size: 12px; color: var(--ink); }
.scene { display: flex; gap: 8px; align-items: center; min-width: 0; font-family: var(--display); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.scene span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; text-transform: none; }

.hook { margin: 4px 14px 0; padding: 10px 12px; font-family: var(--display); font-weight: 600; font-size: clamp(15px, 4.6vw, 19px); line-height: 1.2; text-wrap: balance; color: var(--ink); background: color-mix(in oklab, var(--panel) 80%, transparent); border-left: 3px solid var(--volt); border-radius: 4px 12px 12px 4px; }

.clocks { display: flex; gap: 10px; padding: 6px 14px 4px; justify-content: center; flex-wrap: wrap; }
.clock { display: grid; justify-items: center; gap: 2px; width: 66px; }
.clock .seg { fill: var(--line); transition: fill .4s; }
.clock.threat .seg.on { fill: var(--depol); }
.clock.cosmic .seg.on { fill: var(--latent); }
.clock.progress .seg.on { fill: var(--hyper); }
.clock.delve .seg.on { fill: var(--volt); }
.clock .lbl { font-family: var(--mono); font-size: 9px; line-height: 1.15; text-align: center; color: var(--muted); }
.clock.hidden-cone { opacity: .45; }
.clock.pulse svg { animation: pulse .9s ease-out; }
@keyframes pulse { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }

.focus { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 6px 16px 10px; min-height: 0; }
.speaker { display: flex; gap: 12px; align-items: center; }
.sigil { flex: none; display: grid; place-items: center; }
.sigil svg { color: hsl(var(--h, 260) var(--sig-s) var(--sig-l)); overflow: visible; }
.portrait { flex: 1; min-height: 0; display: grid; place-items: center; }
.portrait .sigil svg { width: clamp(64px, 20svh, 168px); height: clamp(64px, 20svh, 168px); transition: width .35s, height .35s; }
.stage.busy .portrait { flex: 0 0 auto; }
.stage.busy .portrait .sigil svg { width: 52px; height: 52px; }
.overlay.compact .note, .overlay.compact .ov-hook, .overlay.compact .mem-old, .overlay.compact .mem-new, .overlay.compact .ov-t + .note { display: none; }
.overlay.compact { padding: 7px 12px; gap: 4px; }
.overlay.compact .die { width: 26px; height: 26px; font-size: 12px; }
.speaking .sigil svg { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.06); filter: drop-shadow(0 0 6px currentColor); } }
#speakerName { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .02em; }
#speakerRole { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.caption { margin: 0; font-size: clamp(18px, 5.2vw, 22px); line-height: 1.34; text-wrap: pretty; min-height: 4.1em; max-height: 11em; overflow-y: auto; scrollbar-width: none; }
.caption { flex: 0 1 auto; }
.stage.busy .caption { min-height: 0; font-size: clamp(15px, 4.2vw, 18px); }
.focus > * { flex-shrink: 0; }
.focus > .caption, .focus > .portrait { flex-shrink: 1; min-height: 0; }
.caption.long { font-size: clamp(16px, 4.5vw, 19px); }
.caption.xlong { font-size: clamp(14.5px, 4vw, 17px); }
.stage.busy .caption.long, .stage.busy .caption.xlong { font-size: clamp(14px, 3.8vw, 16px); }
.caption .say { font-style: italic; }
.caption .cursor { display: inline-block; width: .5ch; color: var(--muted); }

.overlay { border: 1px solid var(--line); background: color-mix(in oklab, var(--panel) 88%, transparent); backdrop-filter: blur(6px); border-radius: 14px; padding: 10px 12px; display: grid; gap: 6px; animation: rise .35s ease-out; }
@keyframes rise { from { transform: translateY(8px); opacity: .2; } to { transform: none; opacity: 1; } }
.ov-k { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ov-t { font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.25; text-wrap: balance; }
.ov-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.pill.controlled { color: var(--hyper); border-color: color-mix(in oklab, var(--hyper) 45%, transparent); }
.pill.risky { color: var(--volt); border-color: color-mix(in oklab, var(--volt) 45%, transparent); }
.pill.desperate { color: var(--depol); border-color: color-mix(in oklab, var(--depol) 55%, transparent); }
.ov-hook { font-size: 15.5px; line-height: 1.35; }
.dice { display: flex; gap: 6px; flex-wrap: wrap; }
.die { width: 34px; height: 34px; display: grid; place-items: center; font-family: var(--mono); font-weight: 500; font-size: 15px; border: 1.5px solid var(--line); border-radius: 8px; transform: rotate(45deg); }
.die span { transform: rotate(-45deg); }
.die.kept { border-color: var(--muted); }
.die.top { border-color: var(--volt); color: var(--volt); box-shadow: 0 0 12px color-mix(in oklab, var(--volt) 35%, transparent); }
.die.removed { opacity: .35; text-decoration: line-through; }
.die.roll span { animation: tumble .5s steps(6) 1; }
@keyframes tumble { from { opacity: .2; } to { opacity: 1; } }
.band { font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .02em; }
.band.crit, .band.success, .band.true, .band.great { color: var(--hyper); }
.band.cost { color: var(--volt); }
.band.fail, .band.critFail, .band.false { color: var(--depol); }
.mem-old { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in oklab, var(--depol) 60%, transparent); font-size: 14px; }
.mem-new { font-style: italic; font-size: 15px; }
.backstage { border: 1px dashed color-mix(in oklab, var(--latent) 60%, transparent); border-radius: 10px; padding: 8px 10px; font-family: var(--mono); font-size: 11px; line-height: 1.45; color: var(--latent); max-height: 7.5em; overflow: auto; }
.backstage b { font-weight: 500; letter-spacing: .1em; text-transform: uppercase; font-size: 9.5px; }

.party { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 6px; padding: 0 10px 12px; }
.pc { border: 1px solid var(--line); border-radius: 12px; padding: 6px 7px; background: color-mix(in oklab, var(--panel) 80%, transparent); display: grid; gap: 4px; min-width: 0; transition: border-color .3s; }
.pc.active { border-color: color-mix(in oklab, var(--hyper) 70%, transparent); }
.pc.gone { opacity: .4; }
.pc-top { display: flex; align-items: center; gap: 5px; min-width: 0; }
.pc-top .sigil svg { width: 22px; height: 22px; }
.pc-name { font-family: var(--display); font-size: 9.5px; font-weight: 600; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; align-items: end; height: 26px; }
.res i { display: block; background: var(--line); border-radius: 2px; position: relative; height: 100%; overflow: hidden; }
.res i b { position: absolute; inset: auto 0 0; background: var(--depol); transition: height .5s; }
.res-l { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; font-family: var(--mono); font-size: 8px; color: var(--faint); text-align: center; }
.pc-meta { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 9px; color: var(--muted); color: var(--muted); }
.pc-meta .cone { color: var(--hyper); display: inline-flex; }
.pc-tags { font-family: var(--mono); font-size: 8.5px; color: var(--depol); min-height: 1.2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: transparent; }
.progress i { display: block; height: 100%; width: 0; background: var(--hyper); transition: width .3s linear; }
.stage.clean .backstage, .stage.clean .chip { display: none; }

/* ---------- transport ---------- */
.transport { display: grid; gap: 8px; max-width: 440px; width: 100%; margin: 0 auto; }
.tbar { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 10px; font-family: var(--mono); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--hyper); color: var(--ground); border-color: var(--hyper); font-weight: 500; }
.btn[aria-pressed="true"] { border-color: var(--latent); color: var(--latent); }
.btn:disabled { opacity: .45; cursor: default; }
.tbar select { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 8px; font-family: var(--mono); font-size: 12px; }
.scrub { position: relative; height: 26px; }
.scrub input { width: 100%; margin: 0; accent-color: var(--hyper); }
.marks { position: absolute; inset: 0 0 auto; height: 6px; pointer-events: none; }
.marks i { position: absolute; top: 0; width: 3px; height: 6px; border-radius: 2px; background: var(--volt); }
.tinfo { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }

/* ---------- side panel ---------- */
.side { min-width: 0; display: grid; gap: 14px; }
.intro h1 { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 4vw, 38px); letter-spacing: .14em; margin: 0; }
.intro p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 12px; font-family: var(--display); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--hyper); }
.panel { display: grid; gap: 12px; }
.card { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.card h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 14px; line-height: 1.3; text-wrap: balance; }
.card p { margin: 0; }
.k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.clip { grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; column-gap: 12px; }
.clip .rank { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--faint); line-height: 1; }
.why { display: flex; gap: 4px; flex-wrap: wrap; }
.why span { font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 6px; background: var(--panel-2); color: var(--muted); }
.finding { grid-template-columns: 4px minmax(0, 1fr); column-gap: 12px; padding-left: 0; overflow: hidden; }
.finding .stripe { align-self: stretch; margin: -12px 0; }
.finding.success .stripe { background: var(--ok); }
.finding.warning .stripe { background: var(--warn); }
.finding.failure .stripe { background: var(--bad); }
.finding.info .stripe { background: var(--line); }
.finding .ev { font-family: var(--mono); font-size: 10.5px; color: var(--hyper); background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--panel); }
.stat .v { font-family: var(--display); font-weight: 600; font-size: 18px; }
.stat .l { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .t { fill: none; stroke: var(--depol); stroke-width: 1.8; }
.chart .ta { fill: color-mix(in oklab, var(--depol) 16%, transparent); stroke: none; }
.chart .a { fill: none; stroke: var(--hyper); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .m { fill: var(--volt); }
.chart text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
.chart .cur { stroke: var(--ink); stroke-width: 1; opacity: .5; }
.legend { display: flex; gap: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; }
.ledger-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.ledger-list li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; font-size: 15px; }
.ledger-list .tag { font-family: var(--mono); font-size: 10px; color: var(--muted); padding-top: 3px; }
.drift { font-family: var(--mono); font-size: 10px; color: var(--latent); }
.form { display: grid; gap: 10px; }
.form label { display: grid; gap: 4px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.form select, .form input, .form textarea { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 7px 9px; font-family: var(--mono); font-size: 12.5px; min-width: 0; width: 100%; }
.seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.note { font-size: 14px; color: var(--muted); }
.aud { display: flex; gap: 6px; flex-wrap: wrap; }
.err { color: var(--bad); font-family: var(--mono); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <section class="stage-wrap" aria-label="Spectator stage">
    <div id="stage" class="stage">
      <canvas id="field" aria-hidden="true"></canvas>
      <header class="hud">
        <div class="brand">LATENT</div>
        <div class="scene"><span id="sceneTitle">—</span><span id="tierChip" class="chip" hidden></span></div>
      </header>
      <div id="hook" class="hook" hidden></div>
      <div id="clocks" class="clocks"></div>
      <div class="focus">
        <div id="speaker" class="portrait"><div id="speakerSigil" class="sigil"></div></div>
        <div class="speaker">
          <div><div id="speakerName">Loading…</div><div id="speakerRole"></div></div>
        </div>
        <div id="overlay" class="overlay" hidden></div>
        <p id="caption" class="caption" aria-live="polite"></p>
        <div id="backstage" class="backstage" hidden></div>
      </div>
      <div id="party" class="party"></div>
      <div id="progress" class="progress"><i></i></div>
    </div>
    <div class="transport">
      <div class="tbar">
        <button class="btn" id="bPrev" title="Previous beat" aria-label="Previous beat">◀◀</button>
        <button class="btn primary" id="bPlay" aria-label="Play">▶ Play</button>
        <button class="btn" id="bNext" title="Next beat" aria-label="Next beat">▶▶</button>
        <button class="btn" id="speed" title="Playback speed" aria-label="Playback speed">1×</button>
        <button class="btn" id="bBackstage" aria-pressed="false" title="Show agents' private intents and branches not taken">Backstage</button>
        <button class="btn" id="bClean" aria-pressed="false" title="Hide chrome for screen capture">Clean</button>
      </div>
      <div class="scrub"><div id="marks" class="marks"></div><input id="scrub" type="range" min="0" max="0" value="0" aria-label="Session timeline"></div>
      <div class="tinfo"><span id="tPos">0 / 0</span><span id="tMode">replay</span></div>
    </div>
  </section>

  <section class="side">
    <div class="intro">
      <h1>LATENT</h1>
      <p>An RPG about minds that are patterns, played by AI agents and built to be watched. A rules engine owns the dice and the truth; the GM and players only propose. Every session is reviewed automatically for clips and for design wins and failures.</p>
    </div>
    <nav class="tabs" role="tablist" aria-label="Panels">
      <button role="tab" id="tab-sessions" aria-selected="true" data-tab="sessions">Sessions</button>
      <button role="tab" id="tab-clips" aria-selected="false" data-tab="clips">Clips</button>
      <button role="tab" id="tab-review" aria-selected="false" data-tab="review">Review</button>
      <button role="tab" id="tab-ledger" aria-selected="false" data-tab="ledger">Ledger</button>
      <button role="tab" id="tab-live" aria-selected="false" data-tab="live">Run live</button>
    </nav>
    <div id="panel-sessions" class="panel" role="tabpanel"></div>
    <div id="panel-clips" class="panel" role="tabpanel" hidden></div>
    <div id="panel-review" class="panel" role="tabpanel" hidden></div>
    <div id="panel-ledger" class="panel" role="tabpanel" hidden></div>
    <div id="panel-live" class="panel" role="tabpanel" hidden></div>
  </section>
</div>
<script type="module" src="viewer/app.js"></script>
